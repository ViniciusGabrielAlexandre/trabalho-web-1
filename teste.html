<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Text Field</title>

  <!-- Ícones do Google -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons"
        rel="stylesheet">

  <link rel="stylesheet" href="style.css">
  <style>
    /* RESET */
*{
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body{
  height: 100vh;

  display: flex;
  justify-content: center;
  align-items: center;

  background: #f5f5f5;

  font-family: Arial, Helvetica, sans-serif;
}

/* COMPONENTE */
.textfield{
  width: 320px;
}

/* CONTAINER */
.input-container{
  position: relative;

  display: flex;
  align-items: center;

  border: 2px solid #7E57C2;
  border-radius: 16px;

  padding: 16px;

  background: #f5f5f5;

  transition: 0.3s;
}

/* INPUT */
.input-container input{
  flex: 1;

  border: none;
  outline: none;

  font-size: 16px;

  background: transparent;

  margin: 0 10px;
}

/* LABEL */
.input-container label{
  position: absolute;

  left: 52px;
  top: 50%;

  transform: translateY(-50%);

  color: #777;

  background: #f5f5f5;

  padding: 0 4px;

  transition: 0.2s ease;

  pointer-events: none;
}

/* ANIMAÇÃO */
.input-container input:focus + label,
.input-container input:not(:placeholder-shown) + label{

  top: -2px;

  font-size: 12px;

  color: #673AB7;
}

/* FOCO */
.input-container:focus-within{
  border-color: #5E35B1;

  box-shadow: 0 4px 6px rgba(126,87,194,0.3);   
}

/* ÍCONES */
.material-icons{
  color: #555;
}

/* BOTÃO */
.clear-btn{
  border: none;
  background: transparent;

  cursor: pointer;

  display: flex;
  align-items: center;
}

/* TEXTO DE APOIO */
.support-text{
  display: block;

  margin-top: 6px;
  margin-left: 16px;

  font-size: 13px;

  color: #666;
}
  </style>
</head>
<body>

  <div class="textfield">

    <div class="input-container">

      <!-- Ícone -->
      <span class="material-icons icon-left">
        search
      </span>

      <!-- Input -->
      <input type="text" required placeholder=" ">

      <!-- Label -->
      <label>Label text</label>

      <!-- Botão -->
      <button class="clear-btn">
        <span class="material-icons">cancel</span>
      </button>

    </div>

    <small class="support-text">
      Supporting text
    </small>

  </div>

</body>
</html>
