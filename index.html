<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Biblioteca Online</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header id="cabecalho"></header>

<main>

<section id="home">

<h2>Bem-vindo à Biblioteca</h2>

<p>
Sistema para organizar livros de forma simples e prática.
</p>

</section>

<section id="cadastrar">

<h2>Cadastrar Livro</h2>

<form id="formLivro">

<div class="textfield">

<input
type="text"
id="titulo"
required
placeholder=" "
>

<label for="titulo">
Título
</label>

</div>

<div class="textfield">

<input
type="text"
id="autor"
required
placeholder=" "
>

<label for="autor">
Autor
</label>

</div>

<div class="textfield">

<input
type="number"
id="ano"
required
placeholder=" "
>

<label for="ano">
Ano
</label>

</div>

<div class="textfield">

<input
type="text"
id="genero"
required
placeholder=" "
>

<label for="genero">
Gênero
</label>

</div>

<div class="status-container">

<label class="status-label">
Status:
</label>

<div class="radio-group">

<label class="radio-option">

<input
type="radio"
name="status"
value="Lido"
required
>

<span>Lido</span>

</label>

<label class="radio-option">

<input
type="radio"
name="status"
value="Não Lido"
required
>

<span>Não Lido</span>

</label>

</div>

</div>

<button type="submit">
Salvar
</button>

<button type="reset">
Limpar
</button>

</form>

<p id="mensagemErro"></p>

</section>

<section id="listar">

<h2>Lista de Livros</h2>

<div class="tabela-container">
  <table>

  <thead>

  <tr>
  <th class="coluna-id">
  <input type="checkbox"> ID
  </th>

  <th onclick="ordenarLivros('titulo', 'setaTitulo')">
  <div class="titulo-header">
  Título
  <img id="setaTitulo" src="cima.png" width="15">
  </div>
  </th>

  <th onclick="ordenarLivros('autor', 'setaAutor')">
  <div class="titulo-header">
  Autor
  <img id="setaAutor" src="cima.png" width="15">
  </div>
  </th>
  <th>Ano</th>
  <th>Status</th>
  <th>Ações</th>

  </tr>

  </thead>

  <tbody id="tabelaLivros"></tbody>

  </table>

  <div class="paginacao">
    <span>Páginas</span>

    <select>
      <option>10</option>
      <option>25</option>
      <option>75</option>
    </select>

    <span>1-10 de 100</span>

    <button> <img id="flecha" src= "voltar.png" alt="Voltar"> </button>
    <button><img id="flecha" src= "voltarflecha.png" alt="voltar flecha"> </button>
    <button><img id="flecha" src= "avancarflecha.png" alt="avancar flecha"> </button>
    <button><img id="imagen" src= "avancar.png" alt="Avançar"> </button>
  </div>
</div>

</section>

<section id="sobre">

<h2>Sobre</h2>

<p>
POC de sistema web com HTML, CSS e JS.
</p>

</section>

</main>

<footer>

<p>
Equipe: Vinícius Alexandre | Vinicius Theiss | Poliana Masotti
</p>

</footer>

<script>

// HEADER

fetch('header.html')

.then(r => r.text())

.then(data => {

document.getElementById('cabecalho').innerHTML = data;

const usuario = sessionStorage.getItem("usuario");

if(usuario){

const spanUsuario = document.querySelector(".usuario span");

if(spanUsuario){

spanUsuario.innerText = "Usuário: " + usuario;

}

}

});

// CRUD

let livros = JSON.parse(localStorage.getItem("livros")) || [];

let editando = null;

// Esta variável guarda qual será a próxima ordem usada na tabela: true significa crescente e false significa decrescente.
let ordemCrescente = true;

const form = document.getElementById("formLivro");

const tabela = document.getElementById("tabelaLivros");

const erro = document.getElementById("mensagemErro");

// SUBMIT

form.addEventListener("submit", function(e){

e.preventDefault();

let titulo = document.getElementById("titulo").value.trim();

let autor = document.getElementById("autor").value.trim();

let ano = document.getElementById("ano").value.trim();

let genero = document.getElementById("genero").value.trim();

let status = document.querySelector(
'input[name="status"]:checked'
)?.value;

if(!titulo || !autor || !ano || !genero || !status){

erro.innerText = "Preencha todos os campos!";

return;

}

erro.innerText = "";

if(editando !== null){

livros[editando] = {

titulo,
autor,
ano,
genero,
status

};

editando = null;

}else{

livros.push({

titulo,
autor,
ano,
genero,
status

});

}

// SALVAR

salvarDados();

form.reset();

renderTabela();

});

// SALVAR JSON

function salvarDados(){

localStorage.setItem(
"livros",
JSON.stringify(livros)
);

}

// CARREGAR

function carregarDados(){

livros = JSON.parse(
localStorage.getItem("livros")
) || [];

}

// RENDER

function ordenarLivros(campo, idSeta){
livros.sort((livroA, livroB)=>{
let textoA = livroA[campo] || "";
let textoB = livroB[campo] || "";
if(ordemCrescente){

return textoA.localeCompare(textoB);

}

return textoB.localeCompare(textoA);

});

let seta = document.getElementById(idSeta);
seta.src = ordemCrescente ? "cima.png" : "baixo.png";
ordemCrescente = !ordemCrescente;
renderTabela();

}

function renderTabela(){

tabela.innerHTML = "";

livros.forEach((livro, index)=>{

//Parte da poliana checkbox
let linha = `

<tr>

<td class="coluna-id">
<input type="checkbox" class="checkbox-livro">
${index+1}
</td>


<td>${livro.titulo}</td>
<td>${livro.autor}</td>
<td>${livro.ano}</td>
<td>${livro.status || "Lido"}</td>

<td>
<button onclick="editar(${index})">Editar</button>
<button onclick="excluir(${index})">Excluir</button>
</td>

</tr>
`;



tabela.innerHTML += linha;

});

}

// EDITAR

function editar(index){

let livro = livros[index];

document.getElementById("titulo").value = livro.titulo;

document.getElementById("autor").value = livro.autor;

document.getElementById("ano").value = livro.ano;

document.getElementById("genero").value = livro.genero;

document.querySelector(
`input[name="status"][value="${livro.status}"]`
).checked = true;

editando = index;

window.location.href = "#cadastrar";

}

// EXCLUIR

function excluir(index){

livros.splice(index,1);

salvarDados();

renderTabela();

}

// INICIAR

carregarDados();

renderTabela();

</script>

</body>
</html>
