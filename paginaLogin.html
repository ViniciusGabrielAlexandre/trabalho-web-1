<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Biblioteca Online</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="body-login"> <section id="telalogin">

    <h2>Faça seu Login</h2>

    <form id="formLivro"> <div class="textfield">
            <input type="text" id="nome" name="nome_usuario" required placeholder=" ">
            <label for="nome">Nome de Usuário</label>
        </div>

        <div class="textfield">
            <input type="password" id="senha" name="senha" required placeholder=" ">
            <label for="senha">Senha</label>
        </div>

        <div class="opcoes-login">
            <div class="lembreme-container">
                <input type="checkbox" id="lembreme" name="lembreme">
                <label for="lembreme">Lembre-me</label>
        </div>
        <button type="button" id="esquecisenha" class="botao-limpar-estilo">Esqueci minha senha</button>
        </div>

        <div class="botoes-login">
            <button type="button" id="btnLogin">Entrar</button>
        </div>

    </form>

</section>

<script>
const botaoLogin = document.getElementById("btnLogin");

botaoLogin.addEventListener("click", function(){
    const nome = document.getElementById("nome").value;
    const senha = document.getElementById("senha").value;
    const lembreme = document.getElementById("lembreme").checked;

    // salva usuário na sessão
    sessionStorage.setItem("usuario", nome);

    // salva "lembrar-me" no localStorage
    localStorage.setItem("lembreme", lembreme);

    // se estiver marcado, salva a senha
    if(lembreme){
        localStorage.setItem("senha", senha);
    } else {
        localStorage.removeItem("senha");
    }

    // redireciona
    window.location.href = "index.html";
});

window.addEventListener("load", function(){
    const lembreme = localStorage.getItem("lembreme") === "true";
    const senha = localStorage.getItem("senha");

    document.getElementById("lembreme").checked = lembreme;

    if(lembreme && senha){
        document.getElementById("senha").value = senha;
    }
});
</script>
</body>
</html>
